    <!-- Typography: Bricolage Grotesque (Display), Plus Jakarta Sans (Body), JetBrains Mono (Code & Tabular Data) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (Schema.org Person) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Rezaul Islam",
        "alternateName": "RI.dev",
        "jobTitle": "Aspiring AI & Backend Engineer",
        "email": "mailto:rezaulislamakib@gmail.com",
        "telephone": "+8801968151083",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dhaka",
          "addressCountry": "BD"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Daffodil International University"
        },
        "sameAs": [
          "https://www.linkedin.com/in/rezaul-islam-463123288/"
        ],
        "knowsAbout": [
          "Python",
          "Django",
          "Artificial Intelligence",
          "Machine Learning",
          "Natural Language Processing",
          "Linux System Administration",
          "MySQL",
          "AWS Cloud Foundations"
        ]
      }
    </script>

    <!-- Prevent dark/light FOUC on initial load -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ri-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 dark:bg-[#070B14] dark:text-slate-100 antialiased selection:bg-blue-600/20 selection:text-blue-600 dark:selection:bg-sky-400/20 dark:selection:text-sky-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
